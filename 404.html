<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 — Sequence Not Found | SynKyn Studios</title>
  
  <meta name="theme-color" content="#070707">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Spline+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --ink: #070707;
      --ink-2: #0D0D0C;
      --ink-3: #151511;
      --line: #242420;
      --line-2: #34332C;
      --bone: #F2EFE3;
      --bone-dim: #97958A;
      --bone-dimmer: #615F52;
      --volt: #F2D500;
      --volt-hot: #FFEA3D;
      --amber: #E08A00;

      --display: 'Archivo', sans-serif;
      --body: 'Spline Sans', sans-serif;
      --mono: 'IBM Plex Mono', monospace;
      --ease-film: cubic-bezier(.76, 0, .24, 1);
      --ease-out: cubic-bezier(.16, 1, .3, 1);

      --pad-x: clamp(1.1rem, 5vw, 2rem);
      --maxw: 1180px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      background: var(--ink);
      color: var(--bone);
      font-family: var(--body);
      font-weight: 300;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      flex-direction: column;
    }

    ::selection { background: var(--volt); color: var(--ink); }

    a { color: inherit; text-decoration: none; }

    /* Atmosphere */
    .fx-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .6;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 35%, transparent 42%, rgba(0, 0, 0, .62) 100%);
    }

    .grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      pointer-events: none;
      z-index: 998;
      opacity: .04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grain 1.4s steps(4) infinite;
      will-change: transform;
    }

    @keyframes grain {
      0% { transform: translate(0, 0) }
      25% { transform: translate(-2%, 3%) }
      50% { transform: translate(3%, -2%) }
      75% { transform: translate(-3%, -3%) }
      100% { transform: translate(2%, 2%) }
    }

    /* Nav */
    nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem var(--pad-x);
      background: transparent;
    }

    .logo {
      display: flex;
      align-items: center;
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--bone);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-style: italic;
    }

    .logo img {
      height: 28px;
      width: auto;
      margin-right: 10px;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-links a {
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .12em;
      color: var(--bone-dim);
      text-transform: uppercase;
      transition: color .25s;
    }

    .nav-links a:hover {
      color: var(--volt);
    }

    /* Error Layout */
    .error-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      animation: reveal .8s var(--ease-out) both;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-tag {
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--volt);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .error-tag::before, .error-tag::after {
      content: '';
      width: 20px;
      height: 1px;
      background: var(--line);
    }

    .error-code {
      font-family: var(--display);
      font-weight: 900;
      font-size: clamp(6rem, 18vw, 15rem);
      line-height: 0.85;
      color: var(--ink-2);
      -webkit-text-stroke: 1px var(--line-2);
      margin-bottom: 1rem;
      font-variation-settings: 'wdth' 125;
      position: relative;
      text-shadow: 0 20px 50px rgba(0,0,0,0.8);
      letter-spacing: -0.02em;
    }

    .error-code span {
      color: var(--bone);
      -webkit-text-stroke: 0;
      text-shadow: 0 0 30px rgba(242, 213, 0, 0.15);
    }

    .error-title {
      font-family: var(--display);
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 700;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--bone);
      font-style: italic;
    }

    .error-desc {
      font-size: 1.05rem;
      color: var(--bone-dim);
      max-width: 480px;
      margin-bottom: 3.5rem;
      line-height: 1.7;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      position: relative;
      font-family: var(--mono);
      font-size: .76rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink);
      background: var(--volt);
      padding: 1rem 1.8rem;
      border: 1px solid var(--volt);
      transition: transform .25s var(--ease-out), background .25s, color .25s, box-shadow .25s;
      cursor: pointer;
      font-weight: 500;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(242, 213, 0, .2);
    }

    .btn svg {
      width: 15px;
      height: 15px;
    }

    .btn-ghost {
      background: rgba(7, 7, 7, .4);
      color: var(--bone);
      border-color: var(--line-2);
      backdrop-filter: blur(8px);
    }

    .btn-ghost:hover {
      border-color: var(--volt);
      color: var(--volt);
      box-shadow: none;
      transform: translateY(-3px);
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    @media (max-width: 600px) {
      .btn-group {
        flex-direction: column;
        width: 100%;
        max-width: 300px;
      }
      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- Atmosphere Layers -->
  <div class="vignette"></div>
  <div class="grain"></div>

  <!-- Navigation -->
  <nav>
    <a href="/" class="logo">
      <img src="favicon.svg" alt="SynKyn Studios" onerror="this.style.display='none'">
      SynKyn Studios
    </a>
    <div class="nav-links">
      <a href="/">Return to Set</a>
    </div>
  </nav>

  <!-- Error Content -->
  <div class="error-container">
    <div class="error-tag">System Error</div>
    <div class="error-code">4<span>0</span>4</div>
    <div class="error-title">Sequence Not Found</div>
    <div class="error-desc">The cinematic sequence you are looking for has been cut from the final edit, or it never existed. The AI director suggests returning to base.</div>
    
    <div class="btn-group">
      <a href="/" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Return to Homepage
      </a>
      <a href="mailto:hello@synkyn.studio" class="btn btn-ghost">
        Report an Issue
      </a>
    </div>
  </div>

</body>
</html>
